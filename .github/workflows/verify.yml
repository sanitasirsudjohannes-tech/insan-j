name: Verify application

on:
  push:
    branches: [main, ujicoba-ai]
  pull_request:
    branches: [main, ujicoba-ai]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export repaired lockfile for recovery
        run: node -e 'console.log("LOCKFILE_RECOVERY=" + JSON.stringify(JSON.parse(require("fs").readFileSync("package-lock.json", "utf8"))))'
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
