<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSAN-J</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-input-group input {
            flex: 1;
            padding-right: 40px;
        }
        
        .password-toggle {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: #6b7280;
            user-select: none;
            font-size: 1rem;
        }
        
        .password-toggle:hover {
            color: #374151;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600">
    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4 transform transition-all hover:scale-[1.02] duration-300">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="img/logo.png" alt="Logo" class="max-w-[200px] h-auto mx-auto" onerror="this.style.display='none'">
        </div>
        
        <h3 class="text-2xl font-bold text-center text-gray-800 mb-8">Login Aplikasi</h3>
        
        <!-- Error Message -->
        <div id="errorMessage" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 hidden" role="alert">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span class="text-sm"></span>
            </div>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="username">
                    <i class="fas fa-user mr-2 text-blue-500"></i>Username
                </label>
                <div class="relative">
                    <input type="text" id="username" required
                           class="w-full pl-4 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="Masukkan username">
                    <i class="fas fa-user absolute right-3 top-3.5 text-gray-400"></i>
                </div>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">
                    <i class="fas fa-lock mr-2 text-blue-500"></i>Password
                </label>
                <div class="password-input-group">
                    <input type="password" id="password" required
                           class="w-full pl-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="Masukkan password">
                    <i class="fas fa-eye password-toggle" id="togglePassword" style="display: block;"></i>
                </div>
            </div>
            
            <button type="submit" id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-lg">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </form>
               
        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            © 2026 Aplikasi Ceklist. All rights reserved.
        </p>
    </div>

    <script>
        // === KONFIGURASI ===
        const API_URL = 'https://script.google.com/macros/s/AKfycbztXaymY7J461OyfQa4ELS3H9llrowg84pHdxNiKcz38MZ_WkYf9GXW7NoqHSBPYT5x/exec';
        
        // Cek session
        if (sessionStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }

        // Setup password visibility toggle
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePassword');

        if (toggleIcon) {
            toggleIcon.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            });
        }

        // === FUNGSI LOGIN ===
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showError('Username dan password harus diisi!');
                return;
            }
            
            // Loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Loading...';
            errorMsg.classList.add('hidden');
            
            try {
                // 1. COBA LOGIN VIA API
                const response = await fetch(`${API_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Login berhasil via API
                    sessionStorage.setItem('currentUser', JSON.stringify(data.data));
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    throw new Error(data.message || 'Login gagal');
                }
                
            } catch (apiError) {
                console.error('Login API error:', apiError);
                // Tampilkan pesan yang relevan kepada pengguna
                if (apiError && apiError.message) {
                    showError(apiError.message === 'Login gagal' ? 'Username atau password salah!' : apiError.message);
                } else {
                    showError('Gagal terhubung ke server. Silakan coba lagi.');
                }
                resetButton();
            }
        });
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.querySelector('span').textContent = message;
            errorMsg.classList.remove('hidden');
        }
        
        function resetButton() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
        }
    </script>
</body>
</html>
