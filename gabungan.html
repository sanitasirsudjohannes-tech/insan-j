<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Form Checklist</title>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="bg-blue-800 text-white p-4 flex justify-between">
  <h1 class="font-bold">Form Checklist</h1>
  <button onclick="logout()">⎋</button>
</div>

<div class="p-4 space-y-4">

<input type="date" id="tanggal"
class="w-full border p-2 rounded">

<input type="text" id="ruangan"
placeholder="Nama Ruangan"
class="w-full border p-2 rounded">

<div id="formArea"></div>

<button onclick="kirim()"
class="w-full bg-blue-700 text-white p-3 rounded-lg">
Kirim
</button>

</div>

<script>
if(!localStorage.getItem("token")){
  location="index.html";
}

const API="https://script.google.com/macros/s/AKfycbwjP7_Dhjfo4xqNG4B6igfGhtgyk3UBdxsNaDcRcTxR2u6L0yCq-7n1-pHVvYjnlxbP-w/exec";

const DATA={
ruang_bangunan:[
"Dinding",
"Lantai",
"Plafon"
],
pengelolaan_limbah:[
"Tempat sampah tertutup",
"Tidak bau"
],
kebersihan_toilet:[
"Lantai bersih",
"Closet tidak tersumbat"
]
};

const dipilih=JSON.parse(localStorage.getItem("formDipilih"));

dipilih.forEach(kategori=>{
  const box=document.createElement("div");
  box.className="bg-white p-4 rounded shadow";

  box.innerHTML=`<h2 class="font-bold mb-2">${kategori.replace("_"," ")}</h2>`;

  DATA[kategori].forEach(item=>{
    box.innerHTML+=`
    <label class="flex justify-between border-b py-2">
    ${item}
    <input type="checkbox"
     data-sheet="${kategori}"
     value="${item}">
    </label>
    `;
  });

  formArea.appendChild(box);
});

function logout(){
  localStorage.removeItem("token");
  location="index.html";
}

async function kirim(){

  if(!tanggal.value || !ruangan.value){
    alert("Tanggal dan Ruangan wajib diisi");
    return;
  }

  const checks=document.querySelectorAll("input[type=checkbox]");
  const group={};

  checks.forEach(c=>{
    const sheet=c.dataset.sheet;
    if(!group[sheet]) group[sheet]={};

    group[sheet][c.value]=c.checked?"YA":"TIDAK";
  });

  for(const sheet in group){

  const formData = new FormData();
  formData.append("action","save");
  formData.append("sheet",sheet);
  formData.append("token",localStorage.getItem("token"));

  formData.append("data", JSON.stringify({
    Tanggal:tanggal.value,
    Ruangan:ruangan.value,
    ...group[sheet]
  }));

  await fetch(API,{
    method:"POST",
    body: formData
  });
}

  alert("Checklist tersimpan");
  location="dashboard.html";
}

</script>

</body>
</html>
