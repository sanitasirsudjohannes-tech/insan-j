<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Form Checklist - Sistem RS</title>
<style>
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .progress-bar {
    height: 4px;
    background: #e5e7eb;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #3b82f6;
    transition: width 0.3s ease;
  }
</style>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md">
  <h1 class="font-bold text-lg">Form Checklist</h1>
  <button onclick="logout()" class="text-2xl hover:text-red-200" title="Logout">⎋</button>
</div>

<div class="p-4 max-w-4xl mx-auto space-y-4">

  <div class="bg-white p-4 rounded-lg shadow">
    <div class="progress-bar mb-2">
      <div id="progressFill" class="progress-fill" style="width: 0%"></div>
    </div>
    <p id="progressText" class="text-sm text-gray-600 text-right">0% selesai</p>
  </div>

  <div class="bg-white p-4 rounded-lg shadow">
    <label class="block mb-3">
      <span class="font-semibold text-gray-700">Tanggal *</span>
      <input type="date" id="tanggal" 
        class="w-full border p-3 rounded mt-1 focus:ring-2 focus:ring-blue-300 outline-none">
    </label>

    <label class="block">
      <span class="font-semibold text-gray-700">Nama Ruangan *</span>
      <input type="text" id="ruangan" placeholder="Contoh: Ruang Rawat Inap A"
        class="w-full border p-3 rounded mt-1 focus:ring-2 focus:ring-blue-300 outline-none">
    </label>
  </div>

  <div id="formArea" class="space-y-4"></div>

  <div class="flex gap-3">
    <button onclick="batal()"
      class="flex-1 bg-gray-500 hover:bg-gray-600 text-white p-3 rounded-lg transition">
      Batal
    </button>
    <button onclick="kirim()" id="btnKirim"
      class="flex-1 bg-blue-700 hover:bg-blue-800 text-white p-3 rounded-lg transition flex items-center justify-center">
      Kirim Checklist
    </button>
  </div>

</div>

<script>
if(!localStorage.getItem("token")){
  window.location.href = "index.html";
}

const API = "https://script.google.com/macros/s/AKfycbwjP7_Dhjfo4xqNG4B6igfGhtgyk3UBdxsNaDcRcTxR2u6L0yCq-7n1-pHVvYjnlxbP-w/exec";

// Data checklist per kategori
const DATA = {
  ruang_bangunan: [
    "Dinding",
    "Lantai",
    "Plafon",
    "Pintu",
    "Jendela",
    "Ventilasi"
  ],
  pengelolaan_limbah: [
    "Tempat sampah tertutup",
    "Tidak bau",
    "Pemisahan limbah medis",
    "Kantong plastik tersedia"
  ],
  kebersihan_toilet: [
    "Lantai bersih",
    "Closet tidak tersumbat",
    "Air mengalir",
    "Sabun tersedia",
    "Tidak bau"
  ]
};

// Ambil kategori yang dipilih
const dipilih = JSON.parse(localStorage.getItem("formDipilih") || "[]");

// Validasi
if(!dipilih || dipilih.length === 0) {
  alert("Tidak ada checklist yang dipilih");
  window.location.href = "dashboard.html";
}

// Render form
let totalItems = 0;
let checkedItems = 0;

dipilih.forEach(kategori => {
  if(!DATA[kategori]) return; // Skip jika kategori tidak ditemukan
  
  const box = document.createElement("div");
  box.className = "bg-white p-4 rounded-lg shadow";

  box.innerHTML = `
    <h2 class="font-bold text-lg mb-3 text-blue-800 border-b pb-2">
      ${kategori.replace(/_/g, " ").toUpperCase()}
    </h2>
    <div id="items-${kategori}" class="space-y-2"></div>
  `;

  document.getElementById('formArea').appendChild(box);
  
  const itemsContainer = document.getElementById(`items-${kategori}`);
  
  DATA[kategori].forEach(item => {
    totalItems++;
    const itemDiv = document.createElement("div");
    itemDiv.className = "flex items-center justify-between border-b py-2 hover:bg-gray-50";
    itemDiv.innerHTML = `
      <label class="flex items-center gap-2 cursor-pointer flex-1">
        <input type="checkbox" 
          data-sheet="${kategori}" 
          data-item="${item}"
          class="check-item w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
        <span class="text-gray-700">${item}</span>
      </label>
      <span class="status-indicator text-gray-400 text-sm">Belum</span>
    `;
    itemsContainer.appendChild(itemDiv);
  });
});

// Update progress
function updateProgress() {
  const progress = totalItems > 0 ? (checkedItems / totalItems) * 100 : 0;
  document.getElementById('progressFill').style.width = `${progress}%`;
  document.getElementById('progressText').innerText = 
    `${checkedItems} dari ${totalItems} item selesai (${Math.round(progress)}%)`;
}

// Event listener untuk checkbox
document.querySelectorAll('.check-item').forEach(cb => {
  cb.addEventListener('change', function() {
    const statusSpan = this.closest('div').querySelector('.status-indicator');
    if(this.checked) {
      checkedItems++;
      statusSpan.innerHTML = '<span class="text-green-600 font-medium">✓ Selesai</span>';
    } else {
      checkedItems--;
      statusSpan.innerHTML = '<span class="text-gray-400">Belum</span>';
    }
    updateProgress();
  });
});

// Set default tanggal hari ini
const today = new Date().toISOString().split('T')[0];
document.getElementById('tanggal').value = today;

function logout(){
  // Panggil API logout (opsional)
  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "logout",
      token: localStorage.getItem("token")
    })
  }).finally(() => {
    localStorage.clear();
    window.location.href = "index.html";
  });
}

function batal() {
  if(confirm("Yakin ingin membatalkan? Data yang belum tersimpan akan hilang.")) {
    window.location.href = "dashboard.html";
  }
}

async function kirim(){
  const btn = document.getElementById('btnKirim');
  const tanggal = document.getElementById('tanggal');
  const ruangan = document.getElementById('ruangan');

  if(!tanggal.value || !ruangan.value.trim()){
    alert("Tanggal dan Ruangan wajib diisi");
    return;
  }

  // Konfirmasi
  if(checkedItems < totalItems) {
    if(!confirm(`Anda baru mengisi ${checkedItems} dari ${totalItems} item. Lanjutkan menyimpan?`)) {
      return;
    }
  }

  // Disable button
  btn.disabled = true;
  btn.innerHTML = '<span class="loading mr-2"></span>Menyimpan...';

  try {
    // Kelompokkan data per sheet
    const group = {};
    document.querySelectorAll('.check-item').forEach(cb => {
      const sheet = cb.dataset.sheet;
      if(!group[sheet]) group[sheet] = {};
      group[sheet][cb.dataset.item] = cb.checked ? "YA" : "TIDAK";
    });

    let successCount = 0;
    const totalSheets = Object.keys(group).length;

    // Kirim data per sheet - MENGGUNAKAN JSON
    for(const sheet in group) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      const response = await fetch(API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json" // Penting: set header JSON
        },
        body: JSON.stringify({
          action: "save",
          sheet: sheet,
          token: localStorage.getItem("token"),
          data: {
            Tanggal: tanggal.value,
            Ruangan: ruangan.value.trim(),
            ...group[sheet]
          }
        }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if(!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();
      
      if(result.status === "saved" || result.status === "ok") {
        successCount++;
      } else {
        throw new Error(result.message || `Gagal menyimpan sheet ${sheet}`);
      }
    }

    if(successCount === totalSheets) {
      alert(`✅ Checklist berhasil disimpan untuk ${successCount} area`);
      window.location.href = "dashboard.html";
    } else {
      alert(`❌ Hanya ${successCount} dari ${totalSheets} area yang tersimpan`);
    }

  } catch(err) {
    if(err.name === 'AbortError') {
      alert("Koneksi timeout. Silakan coba lagi.");
    } else {
      alert("Error: " + err.message);
    }
    console.error(err);
    
    // Enable button kembali
    btn.disabled = false;
    btn.innerHTML = 'Kirim Checklist';
  }
}

// Update progress awal
updateProgress();
</script>

</body>
</html>
